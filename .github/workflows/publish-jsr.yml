name: Publish Packages to JSR

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Verify code integrity
        run: deno task tests

      - name: Sanitize Version
        run: |
          deno task sanitize-version ./packages/core/deno.jsonc
          deno task sanitize-version ./packages/websocket-tracker/deno.jsonc

      - name: Publish to JSR (@vanaware/browsertorrent)
        run: deno publish --allow-slow-types --allow-dirty
        working-directory: packages/core

      - name: Publish to JSR (@vanaware/browsertorrent-tracker)
        run: deno publish --allow-slow-types --allow-dirty
        working-directory: packages/websocket-tracker